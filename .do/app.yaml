# Digital Ocean App Platform spec.
# Deploy: doctl apps create --spec .do/app.yaml   (or paste into the DO dashboard)
# One Node web service builds the static app and serves it + the /api/chat proxy.
name: workflow-and-property-visualisation
region: nyc
services:
  - name: web
    environment_slug: node-js
    github:
      repo: DvretenarInlead/workflow-and-property-visualisation
      branch: claude/workflow-visualization-hc5eaw
      deploy_on_push: true
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /api/health
    envs:
      # Required for the "Ask AI" chat. Add as an encrypted secret in the DO dashboard.
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      # Optional — override if your key targets a different model.
      - key: ANTHROPIC_MODEL
        scope: RUN_TIME
        value: claude-opus-5
      # --- Standalone mode (single portal, no login) ---
      # Optional HubSpot private-app token (automation read). Powers the standalone
      # "Refresh from HubSpot" button. Not needed if you use portal mode below.
      - key: HUBSPOT_TOKEN
        scope: RUN_TIME
        type: SECRET

      # --- Portal mode (multi-portal, HubSpot OAuth login) ---
      # Set ALL of the following to switch from standalone to portal mode.
      # Encryption key for HubSpot tokens at rest + session cookies. Long random string.
      - key: APP_SECRET
        scope: RUN_TIME
        type: SECRET
      # Postgres connection (bound automatically from the managed DB below).
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      # HubSpot public app OAuth credentials (Developer account → Apps → Auth).
      - key: HUBSPOT_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: HUBSPOT_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      # Must EXACTLY match a redirect URL configured on the HubSpot app, and point
      # at this deployment: https://<your-app>.ondigitalocean.app/auth/hubspot/callback
      - key: HUBSPOT_REDIRECT_URI
        scope: RUN_TIME
        value: https://REPLACE-ME.ondigitalocean.app/auth/hubspot/callback
      # Optional — OAuth scopes to request (defaults shown). Must be granted on the app.
      - key: HUBSPOT_SCOPES
        scope: RUN_TIME
        value: oauth automation crm.objects.deals.read crm.objects.tickets.read

# Managed Postgres for portal mode (portals + encrypted tokens + cached data).
# Remove this block if you only use standalone mode.
databases:
  - name: db
    engine: PG
    version: "16"
    production: false
